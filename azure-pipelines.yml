trigger:
  branches:
    include: [main]
pr:
  branches:
    include: [main]
pool:
  vmImage: ubuntu-latest
steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.11'
  - script: python -m unittest discover -s tests -v
    displayName: Validar regras e dados fictícios
  - script: python -m compileall -q src notebooks
    displayName: Verificar sintaxe Python
  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: notebooks
      artifact: notebooks-validados
    displayName: Publicar notebooks para promoção manual
